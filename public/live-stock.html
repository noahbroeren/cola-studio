<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Live Stock — Cola Studio</title>
  <meta name="description" content="Real-time stock for every size and colour, synchronised with the Cola Studio Weidian store.">
  <link rel="canonical" href="https://colastudio.com/live-stock">
  <meta name="theme-color" content="#130D0A">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cola Studio">
  <meta property="og:title" content="Live Stock — Cola Studio">
  <meta property="og:description" content="Real-time stock for every size and colour, synchronised with the Cola Studio Weidian store.">
  <meta property="og:url" content="https://colastudio.com/live-stock">
  <meta property="og:image" content="https://colastudio.com/assets/brand/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css?v=1.2.0">
  <link rel="stylesheet" href="assets/css/base.css?v=1.2.0">
  <link rel="stylesheet" href="assets/css/components.css?v=1.2.0">
  <link rel="stylesheet" href="assets/css/pages.css?v=1.2.0">
</head>
<body data-page="live-stock" class="page-live-stock">
  <a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="stockpage">
    <section class="page-hero">
      <div class="container page-hero__inner">
        <div>
          <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>Live stock</span></nav>
          <h1 class="h1 page-hero__title">Live <b>stock</b></h1>
        </div>
        <div class="page-hero__aside">
          <p class="lead">Every colour and size, synced with our Weidian store. Tap a size to add it to your order list.</p>
          <p class="sync-line small muted"><span class="live-dot" aria-hidden="true"></span><span data-sync-time>Loading…</span><button class="link link--quiet" type="button" data-refresh>Refresh</button></p>
        </div>
      </div>
    </section>

    <div class="band bg-white">
    <section class="container stock-controls" data-controls>
      <label class="catalog-search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="vh">Search stock</span><input type="search" placeholder="Search a product or colour" data-s-q></label>
      <select class="select select--mini" data-s-cat aria-label="Category"><option value="all">All categories</option></select>
      <div class="tabs stock-controls__status" role="group" aria-label="Status" data-s-status>
        <button class="chip" type="button" aria-pressed="true" data-st="all">All</button>
        <button class="chip" type="button" aria-pressed="false" data-st="instock">In stock</button>
        <button class="chip" type="button" aria-pressed="false" data-st="soldout">Sold out</button>
      </div>
    </section>

    <section class="container stock-main">
      <p class="stock-legend-inline tiny subtle"><span class="status st-instock"><span class="dot"></span>In stock</span><span class="status st-low"><span class="dot"></span>5 or fewer</span><span class="status st-preorder"><span class="dot"></span>Pre-order</span><span class="status st-soldout"><span class="dot"></span>Sold out</span></p>
      <div data-stock-view aria-live="polite"><div class="skeleton" style="height:420px"></div></div>
    </section>
    </div>
  </main>
  <div data-footer></div>
  <noscript><p class="container" style="padding:2rem 0">This site works best with JavaScript enabled. You can still reach us on WhatsApp or by email.</p></noscript>
  <script src="assets/js/garments.js?v=1.2.0"></script>
  <script src="assets/js/core/util.js?v=1.2.0"></script>
  <script src="assets/js/core/data.js?v=1.2.0"></script>
  <script src="assets/js/core/brand.js?v=1.2.0"></script>
  <script src="assets/js/core/media.js?v=1.2.0"></script>
  <script src="assets/js/core/cart.js?v=1.2.0"></script>
  <script src="assets/js/core/ui.js?v=1.2.0"></script>
  <script src="assets/js/core/components.js?v=1.2.0"></script>
  <script src="assets/js/core/layout.js?v=1.2.0"></script>
  <script src="assets/js/pages/live-stock.js?v=1.2.0"></script>
</body>
</html>
