  <main id="main" class="catalog">
    <section class="page-hero catalog-hero">
      <div class="container page-hero__inner">
        <div>
          <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span data-crumb><!--ssr:crumb-->Shop<!--/ssr:crumb--></span></nav>
          <h1 class="h1 page-hero__title" data-split data-cat-title><!--ssr:cat-title-->The <b>Collection</b><!--/ssr:cat-title--></h1>
        </div>
        <div class="page-hero__aside">
          <p class="label"><span data-total><!--ssr:total-->—<!--/ssr:total--></span> pieces</p>
          <p class="vh" data-cat-desc></p><span class="vh" data-skus></span>
        </div>
      </div>
    </section>

    <div class="bg-white">
    <div class="catalog-bar" data-catalog-bar>
      <div class="container catalog-bar__inner">
        <div class="tabs" role="tablist" aria-label="Categories" data-cat-tabs></div>
        <div class="catalog-bar__tools">
          <button class="chip" type="button" data-filters-open aria-controls="filters"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filter<span class="count" data-filter-count></span></button>
          <label class="catalog-search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="vh">Search products</span><input type="search" placeholder="Search" data-q autocomplete="off"></label>
          <label class="vh" for="sort">Sort</label>
          <select class="select select--mini" id="sort" data-sort>
            <option value="featured">Featured</option>
            <option value="new">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="stock">Most in stock</option>
            <option value="name">Name A–Z</option>
          </select>
          <div class="segmented only-desktop" role="group" aria-label="Grid density" data-density>
            <button type="button" aria-pressed="false" data-cols="2" aria-label="2 columns"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg></button>
            <button type="button" aria-pressed="false" data-cols="3" aria-label="3 columns"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h5v16H3zM9.5 4h5v16h-5zM16 4h5v16h-5z"/></svg></button>
            <button type="button" aria-pressed="true" data-cols="4" aria-label="4 columns"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h3.5v16H3zM8.2 4h3.5v16H8.2zM13.4 4h3.5v16h-3.5zM18.6 4h2.4v16h-2.4z"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <section class="container catalog-body" aria-live="polite">
      <div class="active-filters" data-active></div>
      <div class="pgrid" data-grid data-cols="4">
        <!--ssr:grid--><div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div><!--/ssr:grid-->
      </div>
      <div data-empty hidden></div>
    </section>
    </div>

    <aside class="drawer drawer--left filters" id="filters" aria-label="Filters" aria-hidden="true" data-filters></aside>
  </main>
